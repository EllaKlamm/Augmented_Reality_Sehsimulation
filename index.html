<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AR Sehsimulation</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { margin: 0; overflow: hidden; font-family: Arial, sans-serif; }

    /* Sehbehinderungs-Filter werden auf die a-scene angewendet */
    a-scene { transition: filter 0.3s; }

    .filter-katarakt {
      filter: blur(3px) sepia(0.6) brightness(0.9) contrast(0.85);
    }

    .filter-glaukom {
      /* Tunnel-Vision via vignette wird als Overlay gezeigt */
    }

    .filter-makula {
      /* Zentrales Skotom wird als Overlay gezeigt */
    }

    .filter-farbe {
      filter: url(#deuteranopia);
    }

    .screen {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      z-index: 100;
    }

    .hidden { display: none; }

    button {
      padding: 14px 28px;
      font-size: 16px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      width: 220px;
    }

    .btn-primary   { background: #00aaff; color: white; }
    .btn-secondary { background: #ffffff22; color: white; border: 1px solid white; }
    .btn-small     { width: auto; padding: 10px 20px; font-size: 14px; }

    h1 { color: white; font-size: 24px; text-align: center; padding: 0 20px; }
    p  { color: #aaa; font-size: 14px; text-align: center; padding: 0 30px; }

    #sim-ui {
      position: fixed;
      bottom: 30px;
      left: 0; right: 0;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      padding: 0 16px;
      z-index: 100;
    }

    #back-btn {
      position: fixed;
      top: 20px;
      left: 20px;
      z-index: 100;
    }

    .btn-shader        { background: #ffffff22; color: white; border: 1px solid white; }
    .btn-shader.active { background: #00aaff; border-color: #00aaff; }

    #task-box {
      position: fixed;
      top: 0; left: 0; right: 0;
      background: #000000cc;
      padding: 20px;
      text-align: center;
      z-index: 100;
    }

    #task-text {
      color: white;
      font-size: 18px;
      margin-bottom: 8px;
    }

    #timer-bar-wrap {
      background: #ffffff33;
      border-radius: 4px;
      height: 6px;
      width: 100%;
      margin-top: 8px;
    }

    #timer-bar {
      background: #00aaff;
      border-radius: 4px;
      height: 6px;
      width: 100%;
      transition: width 0.1s linear, background 0.3s;
    }

    #answer-ui {
      position: fixed;
      bottom: 20px;
      left: 0; right: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      padding: 0 16px;
      z-index: 100;
    }

    .btn-answer {
      width: 100%;
      max-width: 320px;
      padding: 12px;
      font-size: 15px;
      background: #ffffff22;
      color: white;
      border: 1px solid #ffffff44;
      border-radius: 8px;
      cursor: pointer;
    }

    #screen-feedback {
      background: #111;
      padding: 30px;
    }

    #feedback-icon  { font-size: 48px; }

    #feedback-title {
      color: white;
      font-size: 22px;
      font-weight: bold;
      text-align: center;
    }

    #feedback-name {
      color: #00aaff;
      font-size: 18px;
      text-align: center;
    }

    #feedback-text {
      color: #ccc;
      font-size: 14px;
      text-align: center;
      line-height: 1.6;
      max-width: 320px;
    }

    #feedback-score { color: #aaa; font-size: 13px; }

    #end-score {
      color: white;
      font-size: 48px;
      font-weight: bold;
      text-align: center;
    }

    #end-label {
      color: #aaa;
      font-size: 16px;
      text-align: center;
    }

    #vision-overlay {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 5;
      pointer-events: none;
    }

    #marker-hint {
      position: fixed;
      top: 90px;
      left: 0; right: 0;
      text-align: center;
      color: #ffaa00;
      font-size: 14px;
      z-index: 100;
    }
  </style>
</head>
<body style="margin: 0;">

<!-- SVG Filter für Deuteranopie (Rot-Grün-Schwäche) -->
<svg style="display:none">
  <defs>
    <filter id="deuteranopia">
      <feColorMatrix type="matrix" values="
        0.367 0.861 -0.228 0 0
        0.280 0.673  0.047 0 0
       -0.012 0.043  0.969 0 0
        0     0      0     1 0"/>
    </filter>
  </defs>
</svg>

<script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
<script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

<a-scene id="ar-scene" arjs vr-mode-ui="enabled: false">
  <a-marker preset="hiro" id="hiro-marker">
    <a-entity id="ar-object"></a-entity>
  </a-marker>
  <a-entity camera></a-entity>
</a-scene>

<!-- Vision overlay für Glaukom und Makuladegeneration -->
<canvas id="vision-overlay"></canvas>

<div id="screen-start" class="screen" style="background: #111;">
  <h1>AR Sehsimulation</h1>
  <p>Erlebe wie Menschen mit Sehbehinderungen die Welt wahrnehmen</p>
  <button class="btn-primary" id="btn-to-sim">Simulation</button>
  <button class="btn-secondary" id="btn-to-game">Lernspiel</button>
</div>

<div id="screen-game-intro" class="screen hidden" style="background: #111;">
  <h1>Lernspiel</h1>
  <p>Eine zufällige Sehbehinderung wird aktiviert. Halte die Kamera auf den Marker um die Aufgabe zu starten.</p>
  <button class="btn-primary" id="btn-start-game">Los geht's</button>
  <button class="btn-secondary btn-small" id="btn-intro-back">Zurück</button>
</div>

<div id="screen-sim" class="screen hidden">
  <button class="btn-secondary btn-small" id="back-btn">Zurück</button>
  <div id="sim-ui">
    <button class="btn-shader active" data-shader="none">Ohne</button>
    <button class="btn-shader" data-shader="katarakt">Grauer Star</button>
    <button class="btn-shader" data-shader="glaukom">Glaukom</button>
    <button class="btn-shader" data-shader="makula">Makuladegeneration</button>
    <button class="btn-shader" data-shader="farbe">Rot-Grün-Schwäche</button>
  </div>
</div>

<div id="screen-game" class="screen hidden">
  <div id="task-box">
    <div id="task-text">Aufgabe lädt...</div>
    <div id="timer-bar-wrap">
      <div id="timer-bar"></div>
    </div>
  </div>
  <div id="marker-hint">Halte die Kamera auf den Marker</div>
  <div id="answer-ui">
    <button class="btn-answer" data-answer="none">Ohne Sehbehinderung</button>
    <button class="btn-answer" data-answer="katarakt">Grauer Star</button>
    <button class="btn-answer" data-answer="glaukom">Glaukom</button>
    <button class="btn-answer" data-answer="makula">Makuladegeneration</button>
    <button class="btn-answer" data-answer="farbe">Rot-Grün-Schwäche</button>
  </div>
</div>

<div id="screen-feedback" class="screen hidden">
  <div id="feedback-icon"></div>
  <div id="feedback-title"></div>
  <div id="feedback-name"></div>
  <p id="feedback-text"></p>
  <p id="feedback-score"></p>
  <button class="btn-primary" id="btn-next">Nächste Runde</button>
  <button class="btn-secondary btn-small" id="btn-quit">Beenden</button>
</div>

<div id="screen-end" class="screen hidden" style="background: #111;">
  <h1>Geschafft!</h1>
  <div id="end-score"></div>
  <div id="end-label">richtig</div>
  <button class="btn-primary" id="btn-replay">Nochmal spielen</button>
  <button class="btn-secondary btn-small" id="btn-end-home">Zurück zum Start</button>
</div>

<script>
  // Canvas overlay für Glaukom und Makuladegeneration
  const overlay = document.getElementById('vision-overlay');
  const ctx = overlay.getContext('2d');

  function resizeOverlay() {
    overlay.width  = window.innerWidth;
    overlay.height = window.innerHeight;
  }
  resizeOverlay();
  window.addEventListener('resize', resizeOverlay);

  let activeShader = 'none';

  function renderOverlay() {
    requestAnimationFrame(renderOverlay);
    ctx.clearRect(0, 0, overlay.width, overlay.height);

    if (activeShader === 'glaukom') {
      // Radiale Vignette von außen nach innen
      const cx = overlay.width / 2;
      const cy = overlay.height / 2;
      const r  = Math.max(cx, cy) * 0.95;
      const gradient = ctx.createRadialGradient(cx, cy, r * 0.3, cx, cy, r);
      gradient.addColorStop(0, 'rgba(0,0,0,0)');
      gradient.addColorStop(1, 'rgba(0,0,0,1)');
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, overlay.width, overlay.height);

    } else if (activeShader === 'makula') {
      // Unscharfer Fleck in der Mitte
      const cx = overlay.width / 2;
      const cy = overlay.height / 2;
      const r  = Math.min(overlay.width, overlay.height) * 0.18;
      const gradient = ctx.createRadialGradient(cx, cy, 0, cx, cy, r);
      gradient.addColorStop(0, 'rgba(0,0,0,0.85)');
      gradient.addColorStop(0.6, 'rgba(0,0,0,0.4)');
      gradient.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, overlay.width, overlay.height);
    }
  }
  renderOverlay();

  function setShader(name) {
    activeShader = name;
    const scene = document.getElementById('ar-scene');

    // CSS-Filter entfernen
    scene.style.filter = '';

    if (name === 'katarakt') {
      // Blur + Gelbstich via CSS
      scene.style.filter = 'blur(3px) sepia(0.5) brightness(0.92) contrast(0.85)';

    } else if (name === 'farbe') {
      // Deuteranopie via SVG-Farbmatrix
      scene.style.filter = 'url(#deuteranopia)';
    }
  }

  function setARObject(shader) {
    const entity = document.getElementById('ar-object');
    while (entity.firstChild) entity.removeChild(entity.firstChild);

    if (shader === 'none') return;

    if (shader === 'katarakt' || shader === 'farbe') {
      const isRed = Math.random() > 0.5;
      const obj = document.createElement('a-sphere');
      obj.setAttribute('color', isRed ? '#ff2222' : '#22cc44');
      obj.setAttribute('radius', '0.5');
      obj.setAttribute('position', '0 0.5 0');
      entity.appendChild(obj);

    } else if (shader === 'glaukom') {
      const obj = document.createElement('a-sphere');
      obj.setAttribute('color', '#ffff00');
      obj.setAttribute('radius', '0.4');
      obj.setAttribute('position', '0 0.4 0');
      entity.appendChild(obj);

    } else if (shader === 'makula') {
      const number = Math.floor(1000 + Math.random() * 9000);
      const text = document.createElement('a-text');
      text.setAttribute('value', String(number));
      text.setAttribute('color', 'white');
      text.setAttribute('align', 'center');
      text.setAttribute('position', '0 0.3 0');
      text.setAttribute('scale', '2 2 2');
      entity.appendChild(text);
    }
  }

  const impairments = {
    none: {
      label: 'Ohne Sehbehinderung',
      task: 'Schau dich um. Was siehst du auf dem Marker?',
      explanation: 'Zum Vergleich: So sieht die Welt ohne aktive Sehbehinderung aus. Bemerkst du einen Unterschied zu den anderen Runden?'
    },
    katarakt: {
      label: 'Grauer Star',
      task: 'Welche Farbe hat das Objekt auf dem Marker?',
      explanation: 'Grauer Star trübt die Augenlinse mit zunehmendem Alter. Farben wirken gelblich-verschleiert und Konturen unscharf. Mit einer Operation ist er vollständig heilbar, viele Menschen weltweit haben jedoch keinen Zugang zur Behandlung.'
    },
    glaukom: {
      label: 'Glaukom',
      task: 'Findest du das Objekt auf dem Marker?',
      explanation: 'Glaukom schädigt den Sehnerv und verengt das Gesichtsfeld von außen. Betroffene bemerken es oft erst spät, weil das zentrale Sehen lange erhalten bleibt.'
    },
    makula: {
      label: 'Makuladegeneration',
      task: 'Lies die Zahl auf dem Marker.',
      explanation: 'Makuladegeneration zerstört die Netzhautmitte. Genau dort, wo man hinschaut, entsteht ein blinder Fleck und Lesen sowie Gesichtererkennen werden besonders schwer.'
    },
    farbe: {
      label: 'Rot-Grün-Schwäche',
      task: 'Ist das Objekt auf dem Marker rot oder grün?',
      explanation: 'Rot-Grün-Schwäche ist die häufigste Farbfehlsichtigkeit. Rot und Grün sind kaum unterscheidbar und Ampeln, Obst, Karten und viele Alltagssituationen werden schwieriger.'
    }
  };

  const keys        = Object.keys(impairments);
  let currentShader = null;
  let score         = 0;
  let total         = 0;
  let timerInterval = null;
  let timeLeft      = 0;
  const ROUND_TIME  = 15;

  function startRound() {
    currentShader = keys[Math.floor(Math.random() * keys.length)];
    setShader(currentShader);
    setARObject(currentShader);
    document.getElementById('task-text').textContent = impairments[currentShader].task;
    showScreen('screen-game');
    startTimer();
  }

  function startTimer() {
    timeLeft = ROUND_TIME;
    const bar = document.getElementById('timer-bar');
    bar.style.width = '100%';
    bar.style.background = '#00aaff';

    clearInterval(timerInterval);
    timerInterval = setInterval(() => {
      timeLeft -= 0.1;
      const pct = (timeLeft / ROUND_TIME) * 100;
      bar.style.width = pct + '%';

      if (pct < 30) bar.style.background = '#ff4444';
      else if (pct < 60) bar.style.background = '#ffaa00';

      if (timeLeft <= 0) {
        clearInterval(timerInterval);
        showFeedback(null);
      }
    }, 100);
  }

  function showFeedback(answer) {
    clearInterval(timerInterval);
    total++;

    const correct  = answer === currentShader;
    const timedOut = answer === null;
    if (correct) score++;

    const data = impairments[currentShader];

    document.getElementById('feedback-icon').textContent  = timedOut ? '⏱️' : correct ? '✓' : '✗';
    document.getElementById('feedback-title').textContent = timedOut ? 'Zeit abgelaufen!' : correct ? 'Richtig!' : 'Nicht ganz.';
    document.getElementById('feedback-name').textContent  = 'Es war: ' + data.label;
    document.getElementById('feedback-text').textContent  = data.explanation;
    document.getElementById('feedback-score').textContent = score + ' von ' + total + ' richtig';

    setShader('none');
    setARObject('none');
    showScreen('screen-feedback');
  }

  function showEnd() {
    document.getElementById('end-score').textContent = score + ' von ' + total;
    showScreen('screen-end');
  }

  function showScreen(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.add('hidden'));
    document.getElementById(id).classList.remove('hidden');
  }

  document.getElementById('btn-to-sim').addEventListener('click', () => {
    setShader('none');
    showScreen('screen-sim');
  });

  document.getElementById('btn-to-game').addEventListener('click', () => {
    showScreen('screen-game-intro');
  });

  document.getElementById('btn-start-game').addEventListener('click', () => {
    score = 0;
    total = 0;
    startRound();
  });

  document.getElementById('btn-intro-back').addEventListener('click', () => {
    showScreen('screen-start');
  });

  document.getElementById('back-btn').addEventListener('click', () => {
    setShader('none');
    setARObject('none');
    showScreen('screen-start');
  });

  document.querySelectorAll('.btn-shader').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.btn-shader').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      setShader(btn.dataset.shader);
      setARObject(btn.dataset.shader);
    });
  });

  document.querySelectorAll('.btn-answer').forEach(btn => {
    btn.addEventListener('click', () => showFeedback(btn.dataset.answer));
  });

  document.getElementById('btn-next').addEventListener('click', startRound);

  document.getElementById('btn-quit').addEventListener('click', () => {
    clearInterval(timerInterval);
    setShader('none');
    setARObject('none');
    showEnd();
  });

  document.getElementById('btn-replay').addEventListener('click', () => {
    score = 0;
    total = 0;
    startRound();
  });

  document.getElementById('btn-end-home').addEventListener('click', () => {
    showScreen('screen-start');
  });
</script>
</body>
</html>
