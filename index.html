<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AR Sehsimulation</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { margin: 0; overflow: hidden; font-family: Arial, sans-serif; }

    .screen {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      z-index: 100;
    }

    .hidden { display: none; }

    button {
      padding: 14px 28px;
      font-size: 16px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      width: 220px;
    }

    .btn-primary   { background: #00aaff; color: white; }
    .btn-secondary { background: #ffffff22; color: white; border: 1px solid white; }
    .btn-small     { width: auto; padding: 10px 20px; font-size: 14px; }

    h1 { color: white; font-size: 24px; text-align: center; padding: 0 20px; }
    p  { color: #aaa; font-size: 14px; text-align: center; padding: 0 30px; }

    #sim-ui {
      position: fixed;
      bottom: 30px;
      left: 0; right: 0;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      padding: 0 16px;
      z-index: 100;
    }

    #back-btn {
      position: fixed;
      top: 20px;
      left: 20px;
      z-index: 100;
    }

    .btn-shader        { background: #ffffff22; color: white; border: 1px solid white; }
    .btn-shader.active { background: #00aaff; border-color: #00aaff; }

    #game-ui {
      position: fixed;
      top: 0; left: 0; right: 0;
      background: #000000cc;
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 100;
    }

    #score-display {
      color: white;
      font-size: 20px;
      font-weight: bold;
    }

    #timer-display {
      color: white;
      font-size: 20px;
      font-weight: bold;
    }

    #timer-bar-wrap {
      position: fixed;
      top: 56px;
      left: 0; right: 0;
      background: #ffffff33;
      height: 6px;
      z-index: 100;
    }

    #timer-bar {
      background: #00aaff;
      height: 6px;
      width: 100%;
      transition: width 0.1s linear, background 0.3s;
    }

    #marker-hint {
      position: fixed;
      top: 72px;
      left: 0; right: 0;
      text-align: center;
      color: #ffaa00;
      font-size: 14px;
      z-index: 100;
    }

    #vision-overlay {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 5;
      pointer-events: none;
    }

    #hit-effect {
      position: fixed;
      pointer-events: none;
      z-index: 200;
      font-size: 32px;
      font-weight: bold;
      opacity: 0;
      transition: opacity 0.1s;
    }

    #screen-feedback {
      background: #111;
      padding: 30px;
    }

    #feedback-icon  { font-size: 48px; }

    #feedback-title {
      color: white;
      font-size: 22px;
      font-weight: bold;
      text-align: center;
    }

    #feedback-name {
      color: #00aaff;
      font-size: 18px;
      text-align: center;
    }

    #feedback-text {
      color: #ccc;
      font-size: 14px;
      text-align: center;
      line-height: 1.6;
      max-width: 320px;
    }

    #feedback-score { color: #aaa; font-size: 13px; }

    #end-score {
      color: white;
      font-size: 48px;
      font-weight: bold;
      text-align: center;
    }

    #end-label {
      color: #aaa;
      font-size: 16px;
      text-align: center;
    }
  </style>
</head>
<body style="margin: 0;">

<svg style="display:none">
  <defs>
    <filter id="deuteranopia">
      <feColorMatrix type="matrix" values="
        0.367 0.861 -0.228 0 0
        0.280 0.673  0.047 0 0
       -0.012 0.043  0.969 0 0
        0     0      0     1 0"/>
    </filter>
  </defs>
</svg>

<script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
<script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

<!-- Die a-scene ist die AR Basis, verwaltet von AR.js und A-Frame.
     Der Hiro Marker ist der Ankerpunkt, an dem alle virtuellen Objekte
     hängen. Ohne sichtbaren Marker gibt es keine 3D Registrierung,
     dann bleibt der Bildschirm bei ar-object leer. -->
<a-scene id="ar-scene" arjs vr-mode-ui="enabled: false">
  <a-marker preset="hiro" id="hiro-marker">
    <a-entity id="ar-object"></a-entity>
    <a-entity light="type: ambient; intensity: 0.7"></a-entity>
    <a-entity light="type: directional; intensity: 0.8" position="1 2 1"></a-entity>
  </a-marker>
  <a-entity camera></a-entity>
</a-scene>

<!-- vision-overlay liegt über allem, auch über den Luftballons.
     Hier werden Glaukom und Makula gezeichnet, weil diese beiden
     Effekte unabhängig davon funktionieren müssen, was gerade im
     Bild ist, egal ob Kamera oder virtuelles Objekt. -->
<canvas id="vision-overlay"></canvas>
<div id="hit-effect"></div>

<div id="screen-start" class="screen" style="background: #111;">
  <h1>AR Sehsimulation</h1>
  <p>Erlebe wie Menschen mit Sehbehinderungen die Welt wahrnehmen</p>
  <button class="btn-secondary" id="btn-to-sim">Simulation</button>
  <button class="btn-primary" id="btn-to-game">Lernspiel</button>
</div>

<div id="screen-game-intro" class="screen hidden" style="background: #111;">
  <h1>Lernspiel</h1>
  <p>Bunte Luftballons antippen für Punkte. Rote Luftballons nicht antippen. Halte die Kamera auf den Hiro-Marker.</p>
  <button class="btn-primary" id="btn-start-game">Los geht's</button>
  <button class="btn-secondary btn-small" id="btn-intro-back">Zurück</button>
</div>

<!-- Freie Simulation zum Erkunden. ar-object bleibt hier leer, es geht
     nur um die Kamerabild Verarbeitung, kein Spielziel. -->
<div id="screen-sim" class="screen hidden">
  <button class="btn-secondary btn-small" id="back-btn">Zurück</button>
  <div id="sim-ui">
    <button class="btn-shader active" data-shader="none">Ohne</button>
    <button class="btn-shader" data-shader="katarakt">Grauer Star</button>
    <button class="btn-shader" data-shader="glaukom">Glaukom</button>
    <button class="btn-shader" data-shader="makula">Makuladegeneration</button>
    <button class="btn-shader" data-shader="farbe">Rot-Grün-Schwäche</button>
  </div>
</div>

<div id="screen-game" class="screen hidden">
  <div id="game-ui">
    <div id="score-display">0 Punkte</div>
    <div id="timer-display">15</div>
  </div>
  <div id="timer-bar-wrap">
    <div id="timer-bar"></div>
  </div>
  <div id="marker-hint">Halte die Kamera auf den Marker</div>
</div>

<div id="screen-feedback" class="screen hidden">
  <div id="feedback-icon"></div>
  <div id="feedback-title"></div>
  <div id="feedback-name"></div>
  <p id="feedback-text"></p>
  <p id="feedback-score"></p>
  <button class="btn-primary" id="btn-next">Nächste Runde</button>
  <button class="btn-secondary btn-small" id="btn-quit">Beenden</button>
</div>

<div id="screen-end" class="screen hidden" style="background: #111;">
  <h1>Geschafft!</h1>
  <div id="end-score"></div>
  <div id="end-label">Punkte gesamt</div>
  <button class="btn-primary" id="btn-replay">Nochmal spielen</button>
  <button class="btn-secondary btn-small" id="btn-end-home">Zurück zum Start</button>
</div>

<script>
  // Der Overlay Canvas muss immer die volle Fenstergröße haben, sonst
  // stimmen die Koordinaten für die Vignetten nicht mehr, deshalb bei
  // jedem Resize neu setzen.
  const overlay = document.getElementById('vision-overlay');
  const ctx = overlay.getContext('2d');

  function resizeOverlay() {
    overlay.width  = window.innerWidth;
    overlay.height = window.innerHeight;
  }
  resizeOverlay();
  window.addEventListener('resize', resizeOverlay);

  let activeShader = 'none';

  // Läuft dauerhaft über requestAnimationFrame, auch wenn gerade keine
  // Sehbehinderung aktiv ist. So bleibt der Canvas immer sauber
  // geleert, sobald man auf "Ohne" wechselt.
  function renderOverlay() {
  requestAnimationFrame(renderOverlay);
  ctx.clearRect(0, 0, overlay.width, overlay.height);

  const w = overlay.width;
  const h = overlay.height;
  const cx = w / 2;
  const cy = h / 2;

  if (activeShader === 'katarakt') {
  // gelblicher Schleier plus ein weiches Streulicht in der Mitte,
  // ergänzt den blur Filter auf Video und Canvas weiter unten in
  // setShader. Zusammen ergibt das den typischen milchigen Blick.
  ctx.fillStyle = 'rgba(255, 238, 190, 0.22)';
  ctx.fillRect(0, 0, w, h);

  ctx.fillStyle = 'rgba(255, 255, 255, 0.12)';
  ctx.fillRect(0, 0, w, h);

  const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.max(w, h));
  g.addColorStop(0, 'rgba(255,255,255,0.04)');
  g.addColorStop(1, 'rgba(255,255,255,0.22)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, w, h);
}

  else if (activeShader === 'glaukom') {
    // Tunnelblick: Mitte bleibt frei, außen dunkel
    const r = Math.max(w, h) * 0.65;
    const g = ctx.createRadialGradient(cx, cy, r * 0.18, cx, cy, r);
    g.addColorStop(0, 'rgba(0,0,0,0)');
    g.addColorStop(0.38, 'rgba(0,0,0,0.05)');
    g.addColorStop(0.62, 'rgba(0,0,0,0.65)');
    g.addColorStop(1, 'rgba(0,0,0,0.98)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, w, h);
  }

  else if (activeShader === 'makula') {
    // zentraler blinder Fleck, nicht braun sondern dunkel/grau
    // leichtes Wackeln simuliert die Fixationsinstabilität, die bei
    // Makuladegeneration typisch ist (Auge kann den Blick nicht mehr
    // stabil auf einen Punkt halten, da genau dort das Sehen fehlt)
    const t = Date.now() / 1000;
    const jitterX = Math.sin(t * 3.1) * 7 + Math.sin(t * 5.3) * 3;
    const jitterY = Math.cos(t * 2.7) * 7 + Math.sin(t * 4.1) * 3;
    const mcx = cx + jitterX;
    const mcy = cy + jitterY;

    const r = Math.min(w, h) * 0.34;
    const g = ctx.createRadialGradient(mcx, mcy, 0, mcx, mcy, r);
    g.addColorStop(0, 'rgba(20,20,20,0.98)');
    g.addColorStop(0.45, 'rgba(30,30,30,0.92)');
    g.addColorStop(0.75, 'rgba(60,60,60,0.45)');
    g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, w, h);
  }

  else if (activeShader === 'farbe') {
    // Die eigentliche Simulation läuft jetzt über den SVG-Farbmatrix-Filter
    // direkt auf dem Kamerabild (siehe setShader).
  }
}
renderOverlay();

function getArVideo() {
  // AR.js fügt das Kamerabild als eigenes <video>-Element ein,
  // getrennt vom WebGL-Canvas der a-scene. CSS-Filter greifen hier,
  // anders als bei der a-scene selbst.
  return document.querySelector('video.arjs-video') || document.querySelector('video');
}

function getArCanvas() {
  // Der eigentliche WebGL-Canvas, den A-Frame für die 3D-Objekte
  // (Luftballons) erzeugt. Muss separat gefiltert werden, sonst
  // bleiben virtuelle Objekte von der Sehbehinderung unberührt.
  return document.querySelector('.a-canvas') || document.querySelector('#ar-scene canvas');
}

function setShader(name) {
  console.log("Shader gewählt:", name);
  activeShader = name;

  let filterStr = '';
  if (name === 'katarakt') {
    // Trübung der Augenlinse: Unschärfe, Kontrastverlust, Gelbstich
    filterStr = 'blur(3.5px) sepia(0.35) saturate(0.7) contrast(0.85) brightness(1.08)';
  } else if (name === 'farbe') {
    // nutzt die oben definierte Deuteranopie-Farbmatrix
    filterStr = 'url(#deuteranopia)';
  }

  // Beide Ebenen filtern: Kamerabild und virtuelle Objekte.
  // Sonst wären Luftballons von der Sehbehinderung ausgenommen,
  // was der Simulation widerspricht.
  const video  = getArVideo();
  const canvas = getArCanvas();
  if (video)  video.style.filter  = filterStr;
  if (canvas) canvas.style.filter = filterStr;
}

  // Farbpalette für die "guten" Ballons, Rot ist bewusst nicht dabei
  // und wird separat vergeben, damit es klar als Fehlerfarbe erkennbar
  // bleibt und nicht zufällig aus der Liste gezogen wird.
  const BALLOON_COLORS = ['#2299ff', '#ffdd00', '#cc44ff', '#ff6600', '#00ccaa'];
  const balloons = [];
  let gameActive = false;
  let spawnInterval = null;

  // Startposition der Ballons relativ zum Marker, damit sie nicht alle
  // exakt übereinander aufsteigen.
  function randomPos() {
    return {
      x: (Math.random() - 0.5) * 0.5,
      z: (Math.random() - 0.5) * 0.5
    };
  }

  // Baut einen Ballon aus einfachen A-Frame Primitiven zusammen, Kugel
  // als Körper, Kegel als Knoten unten, kleine helle Kugel als
  // Lichtreflex und ein Zylinder als Schnur. Kein externes 3D Modell
  // nötig, spart Ladezeit.
  function spawnBalloon() {
  const entity = document.getElementById('ar-object');
  const isRed  = Math.random() < 0.3;
  const color  = isRed ? '#ff2222' : BALLOON_COLORS[Math.floor(Math.random() * BALLOON_COLORS.length)];
  const pos    = randomPos();
  const id     = 'b' + Date.now() + Math.floor(Math.random() * 1000);
  const duration = 4000 + Math.random() * 2000;

  const group = document.createElement('a-entity');
  group.setAttribute('id', id);
  group.setAttribute('position', `${pos.x} 0.1 ${pos.z}`);

  const sphere = document.createElement('a-sphere');
  sphere.setAttribute('radius', '0.12');
  sphere.setAttribute('position', '0 0 0');
  sphere.setAttribute(
    'material',
    'color: ' + color + '; roughness: 0.25; metalness: 0.05; shader: standard'
  );

  const knot = document.createElement('a-cone');
  knot.setAttribute('radius-bottom', '0.035');
  knot.setAttribute('radius-top', '0.005');
  knot.setAttribute('height', '0.05');
  knot.setAttribute('position', '0 -0.13 0');
  knot.setAttribute('rotation', '180 0 0');
  knot.setAttribute('material', 'color: ' + color + '; shader: standard');

  const highlight = document.createElement('a-sphere');
  highlight.setAttribute('radius', '0.035');
  highlight.setAttribute('position', '-0.04 0.05 0.09');
  highlight.setAttribute(
    'material',
    'color: white; opacity: 0.65; transparent: true; shader: flat'
  );

  const string = document.createElement('a-cylinder');
  string.setAttribute('color', '#eeeeee');
  string.setAttribute('radius', '0.004');
  string.setAttribute('height', '0.22');
  string.setAttribute('position', '0 -0.27 0');
  string.setAttribute('material', 'shader: flat');

  group.appendChild(sphere);
  group.appendChild(knot);
  group.appendChild(highlight);
  group.appendChild(string);
  entity.appendChild(group);

  const balloon = {
    id, group, isRed, color,
    popped: false,
    startTime: Date.now(),
    duration,
    startY: 0.1,
    endY: 2.0,
    pos
  };
  balloons.push(balloon);

  // Ballon, der nicht rechtzeitig angetippt wurde, verschwindet von
  // allein. Nur bei einem verpassten guten Ballon gibt es Punktabzug,
  // ein übersehener roter Ballon ist ja im Sinne der Aufgabe richtig.
  setTimeout(() => {
    if (!balloon.popped && gameActive) {
      if (!isRed) updateScore(-1, null, null);
      removeBalloon(balloon);
    }
  }, duration);
}

  function removeBalloon(balloon) {
    balloon.popped = true;
    try {
      if (balloon.group && balloon.group.parentNode) {
        balloon.group.parentNode.removeChild(balloon.group);
      }
    } catch(e) {}
    const idx = balloons.indexOf(balloon);
    if (idx > -1) balloons.splice(idx, 1);
  }

  // A-Frame hat eine eigene animation Komponente, hier wird die
  // Position aber lieber manuell pro Frame berechnet, das macht es
  // einfacher, den Ballon jederzeit anzuhalten, sobald er gepoppt wird.
  function animateBalloons() {
    requestAnimationFrame(animateBalloons);
    if (!gameActive) return;
    const now = Date.now();
    balloons.forEach(b => {
      if (b.popped) return;
      const pct = Math.min((now - b.startTime) / b.duration, 1);
      const y   = b.startY + (b.endY - b.startY) * pct;
      try {
        b.group.setAttribute('position', `${b.pos.x} ${y} ${b.pos.z}`);
      } catch(e) {}
    });
  }
  animateBalloons();

// Kein A-Frame Raycaster, sondern eine eigene Lösung: für jeden Ballon
// wird die 3D Weltposition in 2D Bildschirmkoordinaten umgerechnet und
// die Distanz zum Tap Punkt gemessen. Der nächste Ballon innerhalb von
// 80 Pixeln gilt als getroffen. Das funktioniert gut, ist aber
// empfindlicher gegenüber Bildschirmgröße und Blickwinkel als ein
// echter Raycast, deshalb hier bei Problemen zuerst nachsehen.
document.addEventListener('pointerdown', (e) => {
  if (!gameActive) return;

  const sceneEl = document.getElementById('ar-scene');
  const camera = sceneEl.camera;
  if (!camera) return;

  let bestBalloon = null;
  let bestDistance = Infinity;

  balloons.forEach(b => {
    if (b.popped) return;

    const worldPos = new THREE.Vector3();
    b.group.object3D.getWorldPosition(worldPos);

    const screenPos = worldPos.clone().project(camera);

    const x = (screenPos.x * 0.5 + 0.5) * window.innerWidth;
    const y = (-screenPos.y * 0.5 + 0.5) * window.innerHeight;

    const dx = e.clientX - x;
    const dy = e.clientY - y;
    const dist = Math.sqrt(dx * dx + dy * dy);

    if (dist < bestDistance) {
      bestDistance = dist;
      bestBalloon = b;
    }
  });

  console.log("Bester Abstand:", bestDistance);

  if (bestBalloon && bestDistance < 80) {
    popBalloon(bestBalloon, e.clientX, e.clientY);
  }
});

// Kleine Partikel, die beim Poppen auseinanderfliegen und ausblenden
function createPopEffect(balloon) {
  const parent = document.getElementById('ar-object');

  for (let i = 0; i < 10; i++) {
    const particle = document.createElement('a-sphere');

    particle.setAttribute('radius', '0.025');
    particle.setAttribute('color', balloon.color);

    particle.setAttribute(
      'position',
      balloon.group.getAttribute('position')
    );

    const dx = (Math.random() - 0.5) * 0.8;
    const dy = Math.random() * 0.8;
    const dz = (Math.random() - 0.5) * 0.8;

    particle.setAttribute(
      'animation',
      `property: position;
       to: ${balloon.pos.x + dx}
           ${parseFloat(balloon.group.getAttribute('position').y) + dy}
           ${balloon.pos.z + dz};
       dur: 450;
       easing: easeOutQuad`
    );

    particle.setAttribute(
      'animation__fade',
      'property: material.opacity; to: 0; dur: 450'
    );

    parent.appendChild(particle);

    setTimeout(() => {
      if (particle.parentNode) {
        particle.parentNode.removeChild(particle);
      }
    }, 500);
  }
}


  function popBalloon(balloon, x, y) {
    if (balloon.popped) return;
    if (balloon.isRed) {
      updateScore(-1, x, y);
      showHitEffect('', x, y, false);
    } else {
      updateScore(1, x, y);
      showHitEffect('+1', x, y, true);
    }
    try {
      balloon.group.setAttribute('animation', 'property: scale; to: 2.5 2.5 2.5; dur: 120; easing: easeOutQuad');
    } catch(e) {}
    createPopEffect(balloon);
    setTimeout(() => removeBalloon(balloon), 120);
  }

  function showHitEffect(text, x, y, positive) {
    if (!x) return;
    const el = document.getElementById('hit-effect');
    el.textContent = text || (positive ? '+1' : '-1');
    el.style.left  = (x - 20) + 'px';
    el.style.top   = (y - 40) + 'px';
    el.style.color = positive ? '#00ff88' : '#ff4444';
    el.style.opacity = '1';
    setTimeout(() => { el.style.opacity = '0'; }, 700);
  }

  let score      = 0;
  let totalScore = 0;
  let timerInt   = null;
  let timeLeft   = 0;
  const ROUND_TIME = 15;
  let currentShader = null;

  // Zentrale Datenquelle für beide Modi. Label und Erklärungstext
  // werden im Feedback Screen nach jeder Runde angezeigt, die keys
  // dienen gleichzeitig als Liste, aus der pro Runde zufällig gezogen
  // wird. "none" ist bewusst mit drin, damit auch eine Runde ganz ohne
  // Einschränkung möglich ist (dient dem direkten Vergleich)
  const impairments = {
    none: {
      label: 'Ohne Sehbehinderung',
      explanation: 'Zum Vergleich: So sieht die Welt ohne aktive Sehbehinderung aus. Bemerkst du einen Unterschied zu den anderen Runden?'
    },
    katarakt: {
      label: 'Grauer Star',
      explanation: 'Grauer Star trübt die Augenlinse mit zunehmendem Alter. Farben wirken gelblich-verschleiert und Konturen unscharf. Mit einer Operation ist er vollständig heilbar, viele Menschen weltweit haben jedoch keinen Zugang zur Behandlung.'
    },
    glaukom: {
      label: 'Glaukom',
      explanation: 'Glaukom schädigt den Sehnerv und verengt das Gesichtsfeld von außen. Betroffene bemerken es oft erst spät, weil das zentrale Sehen lange erhalten bleibt.'
    },
    makula: {
      label: 'Makuladegeneration',
      explanation: 'Makuladegeneration zerstört die Netzhautmitte. Genau dort, wo man hinschaut, entsteht ein blinder Fleck und Lesen sowie Gesichtererkennen werden besonders schwer.'
    },
    farbe: {
      label: 'Rot-Grün-Schwäche',
      explanation: 'Rot-Grün-Schwäche ist die häufigste Farbfehlsichtigkeit. Rot und Grün sind kaum unterscheidbar und Ampeln, Obst, Karten und viele Alltagssituationen werden schwieriger.'
    }
  };

  const keys = Object.keys(impairments);

  function updateScore(delta, x, y) {
    score += delta;
    document.getElementById('score-display').textContent = score + ' Punkte';
  }

  function clearBalloons() {
    balloons.forEach(b => {
      try {
        if (b.group && b.group.parentNode) b.group.parentNode.removeChild(b.group);
      } catch(e) {}
    });
    balloons.length = 0;
  }

  // Startet eine neue Runde. Wählt zufällig eine Sehbehinderung,
  // aktiviert den passenden Shader und lässt danach laufend neue
  // Ballons spawnen, solange weniger als drei gleichzeitig da sind.
  function startRound() {
    currentShader = keys[Math.floor(Math.random() * keys.length)];
    setShader(currentShader);
    score = 0;
    gameActive = true;
    clearBalloons();
    document.getElementById('score-display').textContent = '0 Punkte';
    showScreen('screen-game');

    spawnBalloon();
    spawnBalloon();
    spawnInterval = setInterval(() => {
      if (gameActive && balloons.length < 3) spawnBalloon();
    }, 1500);

    timeLeft = ROUND_TIME;
    const bar = document.getElementById('timer-bar');
    bar.style.width = '100%';
    bar.style.background = '#00aaff';

    clearInterval(timerInt);
    timerInt = setInterval(() => {
      timeLeft -= 0.1;
      const pct = (timeLeft / ROUND_TIME) * 100;
      bar.style.width = pct + '%';
      document.getElementById('timer-display').textContent = Math.ceil(timeLeft);

      if (pct < 30) bar.style.background = '#ff4444';
      else if (pct < 60) bar.style.background = '#ffaa00';

      if (timeLeft <= 0) {
        clearInterval(timerInt);
        endRound();
      }
    }, 100);
  }

  function endRound() {
    gameActive = false;
    clearInterval(spawnInterval);
    clearBalloons();
    setShader('none');
    totalScore += score;

    const data = impairments[currentShader];
    document.getElementById('feedback-icon').textContent  = score > 3 ? '🎈' : score > 0 ? '😐' : '😵';
    document.getElementById('feedback-title').textContent = score + ' Punkte diese Runde';
    document.getElementById('feedback-name').textContent  = 'Aktive Sehbehinderung: ' + data.label;
    document.getElementById('feedback-text').textContent  = data.explanation;
    document.getElementById('feedback-score').textContent = 'Gesamt: ' + totalScore + ' Punkte';

    showScreen('screen-feedback');
  }

  function showScreen(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.add('hidden'));
    document.getElementById(id).classList.remove('hidden');
  }

  document.getElementById('btn-to-sim').addEventListener('click', () => {
    setShader('none');
    showScreen('screen-sim');
  });

  document.getElementById('btn-to-game').addEventListener('click', () => {
    totalScore = 0;
    showScreen('screen-game-intro');
  });

  document.getElementById('btn-start-game').addEventListener('click', startRound);

  document.getElementById('btn-intro-back').addEventListener('click', () => {
    showScreen('screen-start');
  });

  document.getElementById('back-btn').addEventListener('click', () => {
    setShader('none');
    showScreen('screen-start');
  });

  document.querySelectorAll('.btn-shader').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.btn-shader').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      setShader(btn.dataset.shader);
    });
  });

  document.getElementById('btn-next').addEventListener('click', startRound);

  document.getElementById('btn-quit').addEventListener('click', () => {
    clearInterval(timerInt);
    clearInterval(spawnInterval);
    gameActive = false;
    clearBalloons();
    setShader('none');
    document.getElementById('end-score').textContent = totalScore;
    showScreen('screen-end');
  });

  document.getElementById('btn-replay').addEventListener('click', () => {
    totalScore = 0;
    startRound();
  });

  document.getElementById('btn-end-home').addEventListener('click', () => {
    showScreen('screen-start');
  });
</script>
</body>
</html>
