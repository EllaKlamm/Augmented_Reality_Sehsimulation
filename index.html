<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AR Sehsimulation</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; background: #000; font-family: Arial, sans-serif; }
    canvas { position: fixed; top: 0; left: 0; z-index: -1; }

    .screen {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
    }

    .hidden { display: none; }

    button {
      padding: 14px 28px;
      font-size: 16px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      width: 220px;
    }

    .btn-primary   { background: #00aaff; color: white; }
    .btn-secondary { background: #ffffff22; color: white; border: 1px solid white; }
    .btn-small     { width: auto; padding: 10px 20px; font-size: 14px; }

    h1 { color: white; font-size: 24px; text-align: center; padding: 0 20px; }
    p  { color: #aaa; font-size: 14px; text-align: center; padding: 0 30px; }

    #sim-ui {
      position: fixed;
      bottom: 30px;
      left: 0; right: 0;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      padding: 0 16px;
    }

    #back-btn {
      position: fixed;
      top: 20px;
      left: 20px;
    }

    .btn-shader        { background: #ffffff22; color: white; border: 1px solid white; }
    .btn-shader.active { background: #00aaff; border-color: #00aaff; }

    #task-box {
      position: fixed;
      top: 0; left: 0; right: 0;
      background: #000000cc;
      padding: 20px;
      text-align: center;
    }

    #task-text {
      color: white;
      font-size: 18px;
      margin-bottom: 8px;
    }

    #timer-bar-wrap {
      background: #ffffff33;
      border-radius: 4px;
      height: 6px;
      width: 100%;
      margin-top: 8px;
    }

    #timer-bar {
      background: #00aaff;
      border-radius: 4px;
      height: 6px;
      width: 100%;
      transition: width 0.1s linear, background 0.3s;
    }

    #answer-ui {
      position: fixed;
      bottom: 20px;
      left: 0; right: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      padding: 0 16px;
    }

    .btn-answer {
      width: 100%;
      max-width: 320px;
      padding: 12px;
      font-size: 15px;
      background: #ffffff22;
      color: white;
      border: 1px solid #ffffff44;
      border-radius: 8px;
      cursor: pointer;
    }

    #screen-feedback {
      background: #111;
      padding: 30px;
    }

    #feedback-icon  { font-size: 48px; }

    #feedback-title {
      color: white;
      font-size: 22px;
      font-weight: bold;
      text-align: center;
    }

    #feedback-name {
      color: #00aaff;
      font-size: 18px;
      text-align: center;
    }

    #feedback-text {
      color: #ccc;
      font-size: 14px;
      text-align: center;
      line-height: 1.6;
      max-width: 320px;
    }

    #feedback-score { color: #aaa; font-size: 13px; }

    #end-score {
      color: white;
      font-size: 48px;
      font-weight: bold;
      text-align: center;
    }

    #end-label {
      color: #aaa;
      font-size: 16px;
      text-align: center;
    }

    #xr-exit-btn {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 9999;
    }
  </style>
</head>
<body>

<div id="xr-exit-btn" class="hidden">
  <button class="btn-secondary btn-small" id="btn-exit-xr">AR beenden</button>
</div>

<div id="screen-start" class="screen" style="background: #111;">
  <h1>AR Sehsimulation</h1>
  <p>Erlebe wie Menschen mit Sehbehinderungen die Welt wahrnehmen</p>
  <button class="btn-primary" id="btn-to-sim">Simulation</button>
  <button class="btn-secondary" id="btn-to-game">Lernspiel</button>
  <button class="btn-secondary" id="btn-xr">In AR öffnen</button>
</div>

<div id="screen-game-intro" class="screen hidden" style="background: #111;">
  <h1>Lernspiel</h1>
  <p>Eine zufällige Sehbehinderung wird aktiviert. Löse die Aufgabe und rate danach, was du gerade erlebt hast.</p>
  <button class="btn-primary" id="btn-start-game">Los geht's</button>
  <button class="btn-secondary btn-small" id="btn-intro-back">Zurück</button>
</div>

<div id="screen-sim" class="screen hidden">
  <button class="btn-secondary btn-small" id="back-btn">Zurück</button>
  <div id="sim-ui">
    <button class="btn-shader active" data-shader="none">Ohne</button>
    <button class="btn-shader" data-shader="katarakt">Grauer Star</button>
    <button class="btn-shader" data-shader="glaukom">Glaukom</button>
    <button class="btn-shader" data-shader="makula">Makuladegeneration</button>
    <button class="btn-shader" data-shader="farbe">Rot-Grün-Schwäche</button>
  </div>
</div>

<div id="screen-game" class="screen hidden">
  <div id="task-box">
    <div id="task-text">Aufgabe lädt...</div>
    <div id="timer-bar-wrap">
      <div id="timer-bar"></div>
    </div>
  </div>
  <div id="answer-ui">
    <button class="btn-answer" data-answer="none">Ohne Sehbehinderung</button>
    <button class="btn-answer" data-answer="katarakt">Grauer Star</button>
    <button class="btn-answer" data-answer="glaukom">Glaukom</button>
    <button class="btn-answer" data-answer="makula">Makuladegeneration</button>
    <button class="btn-answer" data-answer="farbe">Rot-Grün-Schwäche</button>
  </div>
</div>

<div id="screen-feedback" class="screen hidden">
  <div id="feedback-icon"></div>
  <div id="feedback-title"></div>
  <div id="feedback-name"></div>
  <p id="feedback-text"></p>
  <p id="feedback-score"></p>
  <button class="btn-primary" id="btn-next">Nächste Runde</button>
  <button class="btn-secondary btn-small" id="btn-quit">Beenden</button>
</div>

<div id="screen-end" class="screen hidden" style="background: #111;">
  <h1>Geschafft!</h1>
  <div id="end-score"></div>
  <div id="end-label">richtig</div>
  <button class="btn-primary" id="btn-replay">Nochmal spielen</button>
  <button class="btn-secondary btn-small" id="btn-end-home">Zurück zum Start</button>
</div>

<script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.164.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.164.0/examples/jsm/"
    }
  }
</script>

<script type="module">
  import * as THREE from 'three';

  const scene    = new THREE.Scene();
  const camera   = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.xr.enabled = true;
  document.body.prepend(renderer.domElement);
  camera.position.z = 1;

  const video = document.createElement('video');
  video.autoplay = true;
  video.playsInline = true;
  const videoTexture = new THREE.VideoTexture(video);

  const plane = new THREE.Mesh(
    new THREE.PlaneGeometry(2, 2),
    new THREE.MeshBasicMaterial({ depthWrite: false })
  );
  plane.renderOrder = -1;
  scene.add(plane);

  let tiltX  = 0;
  let tiltY  = 0;
  let xrMode = false;

  window.addEventListener('deviceorientation', (e) => {
    tiltX = (e.gamma || 0) / 90;
    tiltY = (e.beta  || 0) / 180;
  });

  let virtualObject = null;

  function animate() {
    requestAnimationFrame(animate);
    if (plane.material.uniforms?.uTilt) {
      plane.material.uniforms.uTilt.value.set(tiltX * 0.05, tiltY * 0.05);
    }
    renderer.render(scene, camera);
  }
  animate();

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  async function startCamera() {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'environment' }
    });
    video.srcObject = stream;
  }

  async function startXR() {
    if (!navigator.xr) {
      alert('WebXR nicht verfügbar');
      return;
    }

    const supported = await navigator.xr.isSessionSupported('immersive-ar');
    if (!supported) {
      alert('Immersive AR nicht unterstützt');
      return;
    }

    const session = await navigator.xr.requestSession('immersive-ar', {
      requiredFeatures: ['local'],
      optionalFeatures: ['dom-overlay'],
      domOverlay: { root: document.body }
    });

    renderer.xr.setSession(session);

    plane.visible = false;
    xrMode = true;

    document.getElementById('xr-exit-btn').classList.remove('hidden');
    showScreen('screen-start');

    session.addEventListener('end', () => {
      document.getElementById('xr-exit-btn').classList.add('hidden');
      plane.visible = true;
      xrMode = false;
    });
  }

  const vertexShader = `
    varying vec2 vUv;
    void main() {
      vUv = uv;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }
  `;

  const shaders = {

    none: `
      uniform sampler2D uTexture;
      varying vec2 vUv;
      void main() {
        gl_FragColor = texture2D(uTexture, vUv);
      }
    `,

    katarakt: `
      uniform sampler2D uTexture;
      varying vec2 vUv;
      void main() {
        float b = 0.015;
        vec4 c = vec4(0.0);
        c += texture2D(uTexture, vUv + vec2(-b, -b));
        c += texture2D(uTexture, vUv + vec2( b, -b));
        c += texture2D(uTexture, vUv + vec2(-b,  b));
        c += texture2D(uTexture, vUv + vec2( b,  b));
        c += texture2D(uTexture, vUv);
        c /= 5.0;
        c.r += 0.12;
        c.g += 0.06;
        gl_FragColor = c;
      }
    `,

    glaukom: `
      uniform sampler2D uTexture;
      uniform vec2 uResolution;
      uniform vec2 uTilt;
      varying vec2 vUv;
      void main() {
        vec4 c = texture2D(uTexture, vUv);
        vec2 center = vec2(0.5, 0.5) + uTilt;
        vec2 uv = vUv - center;
        uv.x *= uResolution.x / uResolution.y;
        float dist = length(uv);
        float vignette = smoothstep(0.18, 0.38, dist);
        gl_FragColor = mix(c, vec4(0.0, 0.0, 0.0, 1.0), vignette);
      }
    `,

    makula: `
      uniform sampler2D uTexture;
      uniform vec2 uTilt;
      varying vec2 vUv;
      void main() {
        vec2 center = vec2(0.5, 0.5) + uTilt;
        float dist = distance(vUv, center);
        float b = 0.02 * smoothstep(0.2, 0.0, dist);
        vec4 c = vec4(0.0);
        c += texture2D(uTexture, vUv + vec2(-b, -b));
        c += texture2D(uTexture, vUv + vec2( b, -b));
        c += texture2D(uTexture, vUv + vec2(-b,  b));
        c += texture2D(uTexture, vUv + vec2( b,  b));
        c += texture2D(uTexture, vUv);
        c /= 5.0;
        gl_FragColor = c;
      }
    `,

    farbe: `
      uniform sampler2D uTexture;
      varying vec2 vUv;
      void main() {
        vec4 c = texture2D(uTexture, vUv);
        float r = c.r * 0.567 + c.g * 0.433;
        float g = c.r * 0.558 + c.g * 0.442;
        gl_FragColor = vec4(r, g, c.b, 1.0);
      }
    `
  };

  function buildMaterial(name) {
    return new THREE.ShaderMaterial({
      uniforms: {
        uTexture:    { value: videoTexture },
        uResolution: { value: new THREE.Vector2(window.innerWidth, window.innerHeight) },
        uTilt:       { value: new THREE.Vector2(0, 0) }
      },
      vertexShader,
      fragmentShader: shaders[name],
      depthWrite: false
    });
  }

  function setShader(name) {
    if (!xrMode) {
      plane.material = buildMaterial(name);
    }
  }

  function showVirtualObject(shader) {
    if (virtualObject) {
      scene.remove(virtualObject);
      virtualObject = null;
    }

    if (shader === 'none') return;

    let geometry, material;

    if (shader === 'katarakt') {
      const isRed = Math.random() > 0.5;
      geometry = new THREE.SphereGeometry(0.12, 32, 32);
      material = new THREE.MeshBasicMaterial({
        color: isRed ? 0xff2222 : 0x22cc44
      });
      virtualObject = new THREE.Mesh(geometry, material);
      virtualObject.position.set(0, 0, 0.5);

    } else if (shader === 'glaukom') {
      geometry = new THREE.SphereGeometry(0.1, 32, 32);
      material = new THREE.MeshBasicMaterial({ color: 0xffff00 });
      virtualObject = new THREE.Mesh(geometry, material);
      virtualObject.position.set(0.4, 0.2, 0.5);

    } else if (shader === 'makula') {
      const canvas = document.createElement('canvas');
      canvas.width  = 256;
      canvas.height = 256;
      const ctx = canvas.getContext('2d');
      ctx.clearRect(0, 0, 256, 256);
      ctx.fillStyle = 'white';
      ctx.font = 'bold 160px Arial';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(String(Math.floor(1000 + Math.random() * 9000)), 128, 128);
      const texture = new THREE.CanvasTexture(canvas);
      geometry = new THREE.PlaneGeometry(0.5, 0.5);
      material = new THREE.MeshBasicMaterial({ map: texture, transparent: true });
      virtualObject = new THREE.Mesh(geometry, material);
      virtualObject.position.set(0, 0, 0.4);

    } else if (shader === 'farbe') {
      const isRed = Math.random() > 0.5;
      geometry = new THREE.SphereGeometry(0.12, 32, 32);
      material = new THREE.MeshBasicMaterial({
        color: isRed ? 0xff2222 : 0x22cc44
      });
      virtualObject = new THREE.Mesh(geometry, material);
      virtualObject.position.set(0, 0, 0.5);
    }

    if (virtualObject) scene.add(virtualObject);
  }

  const impairments = {
    none: {
      label: 'Ohne Sehbehinderung',
      task: 'Schau dich um. Was siehst du gerade vor dir?',
      explanation: 'Zum Vergleich: So sieht die Welt ohne aktive Sehbehinderung aus. Bemerkst du einen Unterschied zu den anderen Runden?'
    },
    katarakt: {
      label: 'Grauer Star',
      task: 'Welche Farbe hat das virtuelle Objekt vor dir?',
      explanation: 'Grauer Star trübt die Augenlinse mit zunehmendem Alter. Farben wirken gelblich-verschleiert und Konturen unscharf. Mit einer Operation ist er vollständig heilbar, viele Menschen weltweit haben jedoch keinen Zugang zur Behandlung.'
    },
    glaukom: {
      label: 'Glaukom',
      task: 'Findest du das virtuelle Objekt am Rand deines Blickfeldes?',
      explanation: 'Glaukom schädigt den Sehnerv und verengt das Gesichtsfeld von außen. Betroffene bemerken es oft erst spät, weil das zentrale Sehen lange erhalten bleibt.'
    },
    makula: {
      label: 'Makuladegeneration',
      task: 'Lies die Zahl, die vor dir erscheint.',
      explanation: 'Makuladegeneration zerstört die Netzhautmitte. Genau dort, wo man hinschaut, entsteht ein blinder Fleck und Lesen sowie Gesichtererkennen werden besonders schwer.'
    },
    farbe: {
      label: 'Rot-Grün-Schwäche',
      task: 'Ist das Objekt vor dir rot oder grün?',
      explanation: 'Rot-Grün-Schwäche ist die häufigste Farbfehlsichtigkeit. Rot und Grün sind kaum unterscheidbar und Ampeln, Obst, Karten und viele Alltagssituationen werden schwieriger.'
    }
  };

  const keys = Object.keys(impairments);

  let currentShader = null;
  let score         = 0;
  let total         = 0;
  let timerInterval = null;
  let timeLeft      = 0;
  const ROUND_TIME  = 15;

  function startRound() {
    currentShader = keys[Math.floor(Math.random() * keys.length)];
    setShader(currentShader);
    showVirtualObject(currentShader);
    document.getElementById('task-text').textContent = impairments[currentShader].task;
    showScreen('screen-game');
    startTimer();
  }

  function startTimer() {
    timeLeft = ROUND_TIME;
    const bar = document.getElementById('timer-bar');
    bar.style.width = '100%';
    bar.style.background = '#00aaff';

    clearInterval(timerInterval);
    timerInterval = setInterval(() => {
      timeLeft -= 0.1;
      const pct = (timeLeft / ROUND_TIME) * 100;
      bar.style.width = pct + '%';

      if (pct < 30) bar.style.background = '#ff4444';
      else if (pct < 60) bar.style.background = '#ffaa00';

      if (timeLeft <= 0) {
        clearInterval(timerInterval);
        showFeedback(null);
      }
    }, 100);
  }

  function showFeedback(answer) {
    clearInterval(timerInterval);
    total++;

    const correct  = answer === currentShader;
    const timedOut = answer === null;

    if (correct) score++;

    const data = impairments[currentShader];

    document.getElementById('feedback-icon').textContent  = timedOut ? '⏱️' : correct ? '✓' : '✗';
    document.getElementById('feedback-title').textContent = timedOut ? 'Zeit abgelaufen!' : correct ? 'Richtig!' : 'Nicht ganz.';
    document.getElementById('feedback-name').textContent  = 'Es war: ' + data.label;
    document.getElementById('feedback-text').textContent  = data.explanation;
    document.getElementById('feedback-score').textContent = score + ' von ' + total + ' richtig';

    setShader('none');
    showVirtualObject('none');
    showScreen('screen-feedback');
  }

  function showEnd() {
    document.getElementById('end-score').textContent = score + ' von ' + total;
    showScreen('screen-end');
  }

  function showScreen(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.add('hidden'));
    document.getElementById(id).classList.remove('hidden');
  }

  document.getElementById('btn-to-sim').addEventListener('click', async () => {
    await startCamera();
    setShader('none');
    showScreen('screen-sim');
  });

  document.getElementById('btn-to-game').addEventListener('click', async () => {
    await startCamera();
    showScreen('screen-game-intro');
  });

  document.getElementById('btn-xr').addEventListener('click', async () => {
    await startCamera();
    await startXR();
  });

  document.getElementById('btn-exit-xr').addEventListener('click', () => {
    const session = renderer.xr.getSession();
    if (session) session.end();
  });

  document.getElementById('btn-start-game').addEventListener('click', () => {
    score = 0;
    total = 0;
    startRound();
  });

  document.getElementById('btn-intro-back').addEventListener('click', () => {
    showScreen('screen-start');
  });

  document.getElementById('back-btn').addEventListener('click', () => {
    showScreen('screen-start');
    setShader('none');
  });

  document.querySelectorAll('.btn-shader').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.btn-shader').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      setShader(btn.dataset.shader);
    });
  });

  document.querySelectorAll('.btn-answer').forEach(btn => {
    btn.addEventListener('click', () => showFeedback(btn.dataset.answer));
  });

  document.getElementById('btn-next').addEventListener('click', startRound);

  document.getElementById('btn-quit').addEventListener('click', () => {
    clearInterval(timerInterval);
    setShader('none');
    showVirtualObject('none');
    showEnd();
  });

  document.getElementById('btn-replay').addEventListener('click', () => {
    score = 0;
    total = 0;
    startRound();
  });

  document.getElementById('btn-end-home').addEventListener('click', () => {
    showScreen('screen-start');
  });

</script>
</body>
</html>
