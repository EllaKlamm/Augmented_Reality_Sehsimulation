<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AR Sehsimulation</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; background: #000; font-family: Arial, sans-serif; }
    canvas { position: fixed; top: 0; left: 0; z-index: -1; }

    .screen {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
    }

    .hidden { display: none; }

    button {
      padding: 14px 28px;
      font-size: 16px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      width: 220px;
    }

    .btn-primary   { background: #00aaff; color: white; }
    .btn-secondary { background: #ffffff22; color: white; border: 1px solid white; }
    .btn-small     { width: auto; padding: 10px 20px; font-size: 14px; }

    h1 { color: white; font-size: 24px; text-align: center; padding: 0 20px; }
    p  { color: #aaa; font-size: 14px; text-align: center; padding: 0 30px; }

    #sim-ui {
      position: fixed;
      bottom: 30px;
      left: 0; right: 0;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      padding: 0 16px;
    }

    #back-btn {
      position: fixed;
      top: 20px;
      left: 20px;
    }

    .btn-shader        { background: #ffffff22; color: white; border: 1px solid white; }
    .btn-shader.active { background: #00aaff; border-color: #00aaff; }
  </style>
</head>
<body>

<div id="screen-start" class="screen" style="background: #111;">
  <h1>AR Sehsimulation</h1>
  <p>Erlebe wie Menschen mit Sehbehinderungen die Welt wahrnehmen</p>
  <button class="btn-primary" id="btn-to-sim">Simulation</button>
  <button class="btn-secondary" id="btn-to-game">Lernspiel</button>
</div>

<div id="screen-sim" class="screen hidden">
  <button class="btn-secondary btn-small" id="back-btn">← Zurück</button>
  <div id="sim-ui">
    <button class="btn-shader active" data-shader="none">Ohne</button>
    <button class="btn-shader" data-shader="katarakt">Grauer Star</button>
    <button class="btn-shader" data-shader="glaukom">Glaukom</button>
    <button class="btn-shader" data-shader="makula">Makuladegeneration</button>
    <button class="btn-shader" data-shader="farbe">Rot-Grün-Schwäche</button>
  </div>
</div>

<script type="importmap">
  { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.164.0/build/three.module.js" } }
</script>

<script type="module">
  import * as THREE from 'three';

  // Szene, Kamera, Renderer
  const scene    = new THREE.Scene();
  const camera   = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  document.body.prepend(renderer.domElement);
  camera.position.z = 1;

  // Kamerabild als Video-Textur
  const video = document.createElement('video');
  video.autoplay = true;
  video.playsInline = true;
  const videoTexture = new THREE.VideoTexture(video);

  const plane = new THREE.Mesh(
    new THREE.PlaneGeometry(2, 2),
    new THREE.MeshBasicMaterial()
  );
  scene.add(plane);

  // Gyroskop-Werte für Blickachsen-Verschiebung
  // Das Gyroskop liefert die Geräteneigung damit reagiert der
  // Effekt auf Kopfbewegung statt starr fixiert zu bleiben.
  let tiltX = 0;
  let tiltY = 0;

  window.addEventListener('deviceorientation', (e) => {
    tiltX = (e.gamma || 0) / 90;
    tiltY = (e.beta  || 0) / 180;
  });

  function animate() {
    requestAnimationFrame(animate);
    if (plane.material.uniforms?.uTilt) {
      plane.material.uniforms.uTilt.value.set(tiltX * 0.05, tiltY * 0.05);
    }
    renderer.render(scene, camera);
  }
  animate();

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  // Kamerazugriff (erst nach Nutzerinteraktion erlaubt)
  async function startCamera() {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'environment' }
    });
    video.srcObject = stream;
  }

  // vertexShader: bestimmt Position der Pixel, bleibt immer gleich
  const vertexShader = `
    varying vec2 vUv;
    void main() {
      vUv = uv;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }
  `;

  const shaders = {

    // Kein Effekt
    none: `
      uniform sampler2D uTexture;
      varying vec2 vUv;
      void main() {
        gl_FragColor = texture2D(uTexture, vUv);
      }
    `,

    // Grauer Star (Katarakt)
    // Intensität: mittlerer Verlauf (~0.70 LogMAR, nach Abraham et al. 2024)
    // Blur durch mehrere versetzte Samples + Gelbstich über Rot/Grün-Anhebung.
    // Der Overall-Blur-Simulator für Katarakt in der Literatur reduziert
    // die Sehschärfe auf ca. 0.70 LogMAR mein Blur-Wert von 0.015
    // entspricht diesem mittleren Verlauf.
    katarakt: `
      uniform sampler2D uTexture;
      varying vec2 vUv;
      void main() {
        float b = 0.015;
        vec4 c = vec4(0.0);
        c += texture2D(uTexture, vUv + vec2(-b, -b));
        c += texture2D(uTexture, vUv + vec2( b, -b));
        c += texture2D(uTexture, vUv + vec2(-b,  b));
        c += texture2D(uTexture, vUv + vec2( b,  b));
        c += texture2D(uTexture, vUv);
        c /= 5.0;
        c.r += 0.12;
        c.g += 0.06;
        gl_FragColor = c;
      }
    `,

    // Glaukom
    // Intensität: mittlerer Verlauf (Gesichtsfeld ~20-30°, nach Jones et al. 2020)
    // Abstand von der Blickachse bestimmt Dunkelheit des Randes.
    // uTilt verschiebt die Mitte mit der Geräteneigung (Gyroskop).
    // Blur als primärer Effekt Jones et al. (2020) belegen dass Blur
    // das am häufigsten berichtete Glaukom-Symptom ist.
    glaukom: `
      uniform sampler2D uTexture;
      uniform vec2 uResolution;
      uniform vec2 uTilt;
      varying vec2 vUv;
      void main() {
        vec4 c = texture2D(uTexture, vUv);
        vec2 center = vec2(0.5, 0.5) + uTilt;
        vec2 uv = vUv - center;
        uv.x *= uResolution.x / uResolution.y;
        float dist = length(uv);
        float vignette = smoothstep(0.18, 0.38, dist);
        gl_FragColor = mix(c, vec4(0.0, 0.0, 0.0, 1.0), vignette);
      }
    `,

    // Makuladegeneration
    // Intensität: mittlerer Verlauf (zentrales Skotom ~10-20°)
    // Blur nur in der Bildmitte je näher zur Mitte, desto stärker.
    // uTilt verschiebt den Fleck leicht mit der Geräteneigung.
    // Entspricht dem "central scotoma" Muster in Abraham et al. (2024).
    makula: `
      uniform sampler2D uTexture;
      uniform vec2 uTilt;
      varying vec2 vUv;
      void main() {
        vec2 center = vec2(0.5, 0.5) + uTilt;
        float dist = distance(vUv, center);
        float b = 0.02 * smoothstep(0.2, 0.0, dist);
        vec4 c = vec4(0.0);
        c += texture2D(uTexture, vUv + vec2(-b, -b));
        c += texture2D(uTexture, vUv + vec2( b, -b));
        c += texture2D(uTexture, vUv + vec2(-b,  b));
        c += texture2D(uTexture, vUv + vec2( b,  b));
        c += texture2D(uTexture, vUv);
        c /= 5.0;
        gl_FragColor = c;
      }
    `,

    // Rot-Grün-Schwäche (Deuteranopie)
    // Farbkanal-Transformationsmatrix nach dem Vorbild von
    // Zwoliński et al. (2025)  Rot und Grün werden angenähert,
    // der Unterschied zwischen beiden verschwindet.
    // Vollbild-Effekt, kein Gyroskop nötig.
    farbe: `
      uniform sampler2D uTexture;
      varying vec2 vUv;
      void main() {
        vec4 c = texture2D(uTexture, vUv);
        float r = c.r * 0.567 + c.g * 0.433;
        float g = c.r * 0.558 + c.g * 0.442;
        gl_FragColor = vec4(r, g, c.b, 1.0);
      }
    `
  };

  function buildMaterial(name) {
    return new THREE.ShaderMaterial({
      uniforms: {
        uTexture:    { value: videoTexture },
        uResolution: { value: new THREE.Vector2(window.innerWidth, window.innerHeight) },
        uTilt:       { value: new THREE.Vector2(0, 0) }
      },
      vertexShader,
      fragmentShader: shaders[name]
    });
  }

  function setShader(name) {
    plane.material = buildMaterial(name);
  }

  // Screens ein bzw. ausblenden
  function showScreen(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.add('hidden'));
    document.getElementById(id).classList.remove('hidden');
  }

  document.getElementById('btn-to-sim').addEventListener('click', async () => {
    await startCamera();
    setShader('none');
    showScreen('screen-sim');
  });

  document.getElementById('btn-to-game').addEventListener('click', () => {
    alert('Lernspiel folgt noch!');
  });

  document.getElementById('back-btn').addEventListener('click', () => {
    showScreen('screen-start');
    setShader('none');
  });

  document.querySelectorAll('.btn-shader').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.btn-shader').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      setShader(btn.dataset.shader);
    });
  });

</script>
</body>
</html>
