<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body style="margin:0">
<script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
<script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
<a-scene arjs vr-mode-ui="enabled: false">
  <a-marker preset="hiro">
    <a-sphere color="red" radius="0.3" position="0 0.3 0"></a-sphere>
  </a-marker>
  <a-entity camera></a-entity>
</a-scene>
<canvas id="shader-canvas" style="position:fixed;top:0;left:0;width:100%;height:100%;z-index:10;pointer-events:none;"></canvas>
<script>
  const canvas = document.getElementById('shader-canvas');
  const ctx = canvas.getContext('2d');
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;

  function draw() {
    requestAnimationFrame(draw);
    const aCanvas = document.querySelector('canvas.a-canvas');
    if (!aCanvas) return;

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Glaukom-Vignette als Test
    const cx = canvas.width / 2;
    const cy = canvas.height / 2;
    const r  = Math.max(cx, cy);
    const g  = ctx.createRadialGradient(cx, cy, r * 0.28, cx, cy, r);
    g.addColorStop(0, 'rgba(0,0,0,0)');
    g.addColorStop(0.6, 'rgba(0,0,0,0.7)');
    g.addColorStop(1, 'rgba(0,0,0,1)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
  }
  draw();
</script>
</body>
</html>
